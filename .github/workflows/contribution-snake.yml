name: Update GitHub contribution snake

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/contribution-snake.yml'
      - 'about.md'

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: determine123
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
      - name: Add a black background to both SVGs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          for path in Path("dist").glob("*.svg"):
              svg = path.read_text(encoding="utf-8")
              svg, count = re.subn(
                  r"(<svg\b[^>]*>)",
                  r'\1\n<rect width="100%" height="100%" fill="#000000"/>',
                  svg,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"Could not add background to {path}")
              path.write_text(svg, encoding="utf-8")
          PY
      - name: Publish generated SVGs to the output branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
