name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Cache public avatar locally
        run: |
          if curl --fail --location --retry 2 --max-time 30 'https://avatars.githubusercontent.com/u/182319045?s=240&v=4' -o /tmp/avatar.png; then
            mv /tmp/avatar.png img/avatar.png
          else
            echo '::warning::Avatar download failed; retaining the remote fallback.'
          fi
      - name: Verify project directory sync
        run: python3 -m unittest discover -s tests -p "test_sync_projects.py" -v
      - name: Generate site timestamps
        run: python3 .github/scripts/site_status.py
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
      - name: Prepare Cloudflare mirror
        run: python3 .github/scripts/prepare_cloudflare.py
      - name: Upload Cloudflare package
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-static-site
          path: .cloudflare-site/
          include-hidden-files: true
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published homepage
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 30 "$PAGE_URL" -o /tmp/blog-home.html
          python3 - <<'PY'
          from pathlib import Path
          html = Path('/tmp/blog-home.html').read_text(encoding='utf-8')
          assert 'id="page-content"' in html, 'Published homepage is missing the blog layout'
          assert 'id="global-music"' in html, 'Published homepage is missing the music player'
          print('Published blog responds successfully with its current layout and music player.')
          PY
