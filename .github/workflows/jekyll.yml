name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Cache public avatar locally
        run: |
          if curl --fail --location --retry 2 --max-time 30 'https://avatars.githubusercontent.com/u/182319045?s=240&v=4' -o /tmp/avatar.png; then
            mv /tmp/avatar.png img/avatar.png
          else
            echo '::warning::Avatar download failed; retaining the remote fallback.'
          fi
      - name: Verify project directory sync
        run: python3 -m unittest discover -s tests -p "test_sync_projects.py" -v
      - name: Verify Vercel packaging
        run: python3 -m unittest discover -s tests -p "test_prepare_vercel.py" -v
      - name: Verify visit statistics
        run: node --test tests/test_visit_stats.cjs tests/test_site_statistics.cjs
      - name: Verify blog Agent API
        run: |
          node --check js/blog-agent.js
          node --check workers/blog-agent/src/index.js
          node --test tests/test_blog_agent_worker.cjs
      - name: Generate site timestamps
        run: python3 .github/scripts/site_status.py
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
      - name: Prepare Vercel prebuilt output
        run: python3 .github/scripts/prepare_vercel.py
      - name: Upload Vercel prebuilt output
        uses: actions/upload-artifact@v4
        with:
          name: vercel-prebuilt-site
          path: .vercel/output/
          include-hidden-files: true
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published homepage
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 30 "$PAGE_URL" -o /tmp/blog-home.html
          python3 - <<'PY'
          from pathlib import Path
          html = Path('/tmp/blog-home.html').read_text(encoding='utf-8')
          assert 'id="page-content"' in html, 'Published homepage is missing the blog layout'
          assert 'id="global-music"' in html, 'Published homepage is missing the music player'
          assert '/css/space-time.css' in html, 'Published homepage is missing the shared space-time stylesheet'
          assert '/css/minimal.css' in html, 'Published homepage is missing the reading-first stylesheet'
          assert '/js/blog-agent.js' in html, 'Published homepage is missing the blog Agent script'
          assert 'id="blog-agent-open"' in html, 'Published homepage is missing the global Agent launcher'
          assert 'id="blog-agent-dialog"' in html, 'Published homepage is missing the Agent dialog'
          assert 'id="blog-agent-inline"' in html, 'Published homepage is missing the interactive homepage Agent entry'
          assert 'class="profile-home"' in html, 'Published homepage is missing the profile-first layout'
          assert 'id="home-about-title"' in html, 'Published homepage is missing the profile summary'
          assert 'id="home-stats-title"' in html, 'Published homepage is missing site statistics'
          assert 'id="latest-writing-title"' in html, 'Published homepage is missing recent writing'
          assert 'id="home-explore-title"' in html, 'Published homepage is missing topic entry points'
          print('Published blog responds successfully with the profile-first layout, writing entry points, music player, and blog Agent.')
          PY

  deploy-vercel:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Download mirror package
        uses: actions/download-artifact@v4
        with:
          name: vercel-prebuilt-site
          path: .vercel/output
      - name: Link Vercel project
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_ORG_ID" || { echo '::error::VERCEL_ORG_ID is missing'; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo '::error::VERCEL_PROJECT_ID is missing'; exit 1; }
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s","projectName":"determine-blog"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
      - name: Deploy Vercel mirror
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo '::error::VERCEL_TOKEN is missing'; exit 1; }
          npx --yes vercel@latest deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
      - name: Verify Vercel mirror
        run: |
          set -euo pipefail
          base='https://determine-blog.vercel.app'
          for path in / /learning/ /about/; do
            file="$(mktemp)"
            curl --fail --location --retry 4 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 30 "$base$path" -o "$file"
            python3 - "$file" "$path" <<'PY'
          from pathlib import Path
          import re
          import sys

          html = Path(sys.argv[1]).read_text(encoding='utf-8')
          path = sys.argv[2]
          assert not re.search(r'\{%|\{\{', html), f'{path} contains unrendered Jekyll Liquid'
          assert '<title>' in html.lower(), f'{path} is missing a rendered title'
          assert '/css/minimal.css' in html, f'{path} is missing the shared stylesheet'
          if path == '/':
              assert 'class="profile-home"' in html, 'Homepage is missing the profile-first layout'
              assert 'id="blog-agent-open"' in html, 'Homepage is missing the blog Agent launcher'
          print(f'Verified {path}: rendered Jekyll page with expected shared layout.')
          PY
            rm "$file"
          done
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 3 "$base/css/minimal.css" -o /dev/null
