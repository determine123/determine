<section class="card music-card music-global is-compact" id="global-music" aria-label="音乐播放器"><div class="card-label music-handle" id="music-handle" tabindex="0" aria-label="拖动播放器，方向键微调位置"><h2>音乐 / MUSIC</h2><div class="music-window-controls"><button id="music-lock" aria-label="固定当前位置" aria-pressed="false" title="固定当前位置">◇</button><button id="music-close" aria-label="关闭播放器并暂停音乐" title="关闭播放器并暂停音乐">×</button><button id="music-expand" aria-label="展开播放器" aria-expanded="false">⌃</button></div></div><div class="music-main"><img id="music-cover" class="music-cover" alt="专辑封面"><div class="music-info"><h3 id="music-title">平凡之路</h3><p id="music-note">朴树</p><div class="music-controls"><button id="music-prev" aria-label="上一首">⏮</button><button id="music-play" class="music-play" aria-label="播放">▶</button><button id="music-next" aria-label="下一首">⏭</button><button id="music-list-toggle" aria-label="显示歌单" aria-expanded="false">☷</button></div></div></div><div class="music-progress"><span id="music-current">0:00</span><input id="music-seek" type="range" min="0" max="100" value="0" aria-label="播放进度"><span id="music-duration">0:00</span></div><div class="music-bottom"><span id="music-status" role="status">点击播放试听</span><a id="music-full" target="_blank" rel="noopener noreferrer">Apple Music ↗</a></div><div class="music-position"><span id="music-position-status">悬浮 · 可拖动</span><select id="music-position" aria-label="播放器位置"><option value="">选择位置</option><option value="bottom-left">左下角</option><option value="bottom-right">右下角</option><option value="top-left">左上角</option><option value="top-right">右上角</option></select></div><div class="music-volume"><span>音量</span><input id="music-volume" type="range" min="0" max="100" value="35" aria-label="音乐音量"><span>随机播放 · 约 30 秒试听</span></div><div id="music-list" class="music-list" hidden></div><audio id="music-audio" preload="none"></audio></section>
