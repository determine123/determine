{% assign totals = site.data.site_statistics %}
<section class="card site-statistics" aria-label="博客历史累计统计">
  <div class="card-label"><h2>博客一览 / STATS</h2><span>历史累计</span></div>
  <div class="history-counts">
    <a href="{{ '/essays/' | relative_url }}" aria-label="随笔，历史累计 {{ totals.essays }} 篇"><strong>{{ totals.essays }}</strong><span>随笔</span></a>
    <a href="{{ '/archive/' | relative_url }}" aria-label="文章，历史累计 {{ totals.articles }} 篇"><strong>{{ totals.articles }}</strong><span>文章</span></a>
    <a href="{{ '/guestbook/' | relative_url }}" aria-label="评论，历史累计 {{ totals.comments }} 条"><strong>{{ totals.comments }}</strong><span>评论</span></a>
    <a href="{{ '/colophon/' | relative_url }}" aria-label="阅读，历史累计 {{ totals.reads }} 次，查看统计说明"><strong>{{ totals.reads | divided_by: 10000 }}<small>万</small></strong><span>阅读</span></a>
  </div>
  <p class="history-counts-note">{{ totals.updated | date: '%Y.%m.%d' }} · 历史数据由作者提供</p>
  <div class="history-counts-links"><a href="{{ '/feed.xml' | relative_url }}">RSS 订阅 ↗</a><a href="{{ '/sitemap.xml' | relative_url }}">站点地图 ↗</a></div>
</section>
