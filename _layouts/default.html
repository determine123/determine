<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.description }}">
  {% include head/custom.html %}
  <title>{{ page.title | default: site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <header class="site-header"><a class="brand" href="{{ '/' | relative_url }}">李天明 / Li Tianming</a><nav aria-label="主导航">{% for item in site.data.navigation %}<a href="{{ item.url | relative_url }}">{{ item.title }}</a>{% endfor %}</nav><a class="header-link" href="https://github.com/determine123" target="_blank" rel="noreferrer">GitHub</a></header>
  <main>{{ content }}</main>
  <footer class="site-footer"><span>© 2026 李天明 · determine123</span><span>Agent · AI Infra · Embodied AI · Robotics</span></footer>
</body>
</html>
