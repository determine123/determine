<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="{{ page.excerpt | default: site.description | strip_html | escape }}"><title>{% if page.title %}{{ page.title | escape }} · {% endif %}determine</title><link rel="canonical" href="{{ page.url | absolute_url }}"><link rel="alternate" type="application/atom+xml" title="determine" href="{{ '/feed.xml' | relative_url }}"><link rel="stylesheet" href="{{ '/css/personal.css' | relative_url }}?v={{ site.time | date: '%s' }}"></head>
<body><header class="top"><a class="brand" href="{{ '/' | relative_url }}">determine<span style="color:#77908f">.log</span></a><nav aria-label="主导航"><a href="{{ '/archive/' | relative_url }}">写作</a><a href="{{ '/projects/' | relative_url }}">项目</a><a href="{{ '/about/' | relative_url }}">关于</a></nav></header><div id="page-content" data-base="{{ '/' | relative_url }}">{{ content }}</div>{% include music-player.html %}
<footer class="footer"><span>© {{ site.time | date: '%Y' }} determine · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></span><span>设计参考 <a href="https://hux.pro/">Hux.Pro</a> · 感谢 <a href="https://github.com/Huxpro/huxpro.github.io">Huxpro</a> 的博客模板</span></footer>
<button class="search-trigger" id="search-open" aria-label="搜索文章">⌕ 搜索文章或前往页面 <kbd>Ctrl K</kbd></button><dialog id="search-dialog" aria-label="站内搜索"><div class="search-head"><input id="search-query" type="search" placeholder="搜索 Agent、Triton、求职…" aria-label="搜索关键词"><button class="close" id="search-close" aria-label="关闭搜索">×</button></div><div class="results" id="search-results"></div></dialog>
<div id="search-index" hidden>{% for post in site.posts %}<a href="{{ post.url | relative_url }}" data-tags="{{ post.tags | join: ' ' | escape }}">{{ post.title | escape }}</a>{% endfor %}<a href="{{ '/projects/' | relative_url }}">项目作品集</a><a href="{{ '/about/' | relative_url }}">关于我与联系</a><a href="{{ '/archive/' | relative_url }}">全部文章</a></div><script src="{{ '/js/personal.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script><script src="{{ '/js/music.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script><script src="{{ '/js/navigation.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script></body></html>
